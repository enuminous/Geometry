name: Lean Geometry Audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan without invoking lean-action
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and generate Lake manifest
        run: |
          lake update
          test -f lake-manifest.json
      - name: Compile proof library and audit
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
      - name: Audit theorem dependencies and execute witness
        run: |
          lake env lean Axioms.lean
          lake build geometryAudit
          lake exe geometryAudit
          if grep -nE '\b(sorry|admit|unsafe axiom)\b' Geometry.lean Axioms.lean Main.lean; then exit 1; fi
