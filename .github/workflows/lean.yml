name: Lean Geometry Audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib dependencies
        run: lake update
      - name: Build Geometry proof library
        run: lake build Geometry
      - name: Audit theorems and axioms
        run: |
          lake env lean Axioms.lean
          lake build geometryAudit
          lake exe geometryAudit
          if grep -nE '\b(sorry|admit|unsafe axiom)\b' Geometry.lean Axioms.lean Main.lean; then exit 1; fi
